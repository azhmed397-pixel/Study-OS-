<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Study OS">
<meta name="description" content="مذاكرة ذكية: مراجعة متباعدة وسجل أخطاء وامتحانات شخصية">
<link rel="manifest" href="so7.webmanifest">
<link rel="icon" href="so7-icon-192.png">
<link rel="apple-touch-icon" href="so7-apple.png">
<title>أحمد Study OS</title>
<style>
/* =====================================================================
   DESIGN SYSTEM  ·  أحمد Study OS
   1) Tokens (color roles, type scale, radii, spacing)  — light + real dark
   2) Base
   3) Components (group/cell, card, button, chip, seg, badge, ring, bar,
      field, switch, sheet, page, tabbar, empty)
   Every screen below is built only from these pieces.
   ===================================================================== */

/* ---------- 1) TOKENS ---------- */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Arabic","SF Pro Text","Segoe UI","Noto Sans Arabic","Cairo",Tahoma,system-ui,sans-serif;

  /* surfaces */
  --bg:#F2F2F7;            /* grouped background */
  --bg-outer:#E5E5EA;
  --surface:#FFFFFF;       /* cards */
  --surface-elev:#FFFFFF;  /* cards inside sheets */
  --bg-sheet:#F2F2F7;
  --bar:rgba(249,249,251,.82);
  --fill:rgba(120,120,128,.08);
  --fill2:rgba(120,120,128,.14);
  --seg-on:#FFFFFF;
  --sep:rgba(60,60,67,.16);

  /* text */
  --label:#0F0F12;
  --label2:rgba(60,60,67,.66);
  --label3:rgba(60,60,67,.34);

  /* accent */
  --accent:#5451D6;        /* text / icons */
  --accent-solid:#5451D6;  /* fills */
  --accent-tint:rgba(84,81,214,.12);
  --hero:#4B48C9;
  --on-accent:#FFFFFF;

  /* status */
  --green:#1E9E52; --orange:#E07B00; --red:#E0352B; --blue:#0A72E8;

  /* subject palette */
  --sc0:#5451D6; --sc1:#0E9FB0; --sc2:#E07B00; --sc3:#DB3F86; --sc4:#1E9E52; --sc5:#0A72E8;

  /* radii + spacing */
  --r-s:10px; --r-m:14px; --r-l:20px; --r-xl:28px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:28px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#000000;
  --bg-outer:#000000;
  --surface:#1C1C1E;
  --surface-elev:#2C2C2E;
  --bg-sheet:#1C1C1E;
  --bar:rgba(22,22,24,.80);
  --fill:rgba(120,120,128,.14);
  --fill2:rgba(120,120,128,.26);
  --seg-on:#636366;
  --sep:rgba(84,84,88,.6);
  --label:#F5F5F7;
  --label2:rgba(235,235,245,.62);
  --label3:rgba(235,235,245,.30);
  --accent:#8B89FF;
  --accent-solid:#6461EE;
  --accent-tint:rgba(139,137,255,.20);
  --hero:#3D3AA8;
  --green:#32D074; --orange:#FF9F1A; --red:#FF5A50; --blue:#4DA3FF;
  --sc0:#8B89FF; --sc1:#3CC8D8; --sc2:#FFA01F; --sc3:#FF6BA9; --sc4:#32D074; --sc5:#4DA3FF;
}
.c0{--cc:var(--sc0)}.c1{--cc:var(--sc1)}.c2{--cc:var(--sc2)}.c3{--cc:var(--sc3)}.c4{--cc:var(--sc4)}.c5{--cc:var(--sc5)}

/* type scale (no letter-spacing: it breaks Arabic joining) */
.t-large{font-size:34px;font-weight:700;line-height:1.25}
.t-title{font-size:26px;font-weight:700;line-height:1.3}
.t-head{font-size:17px;font-weight:600}
.t-body{font-size:16px}
.t-sub{font-size:14px;color:var(--label2)}
.t-foot{font-size:13px;color:var(--label2)}

/* ---------- 2) BASE ---------- */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font);background:var(--bg-outer);color:var(--label);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
#app{position:fixed;inset:0;width:100%;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden;transition:background .3s}
@media(min-width:520px){#app{box-shadow:0 0 0 1px var(--sep)}}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(var(--safe-t) + 8px) var(--s4) calc(110px + var(--safe-b));-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.stack>*+*{margin-top:var(--s5)}
.row{display:flex;align-items:center;gap:var(--s3)}
.grow{flex:1;min-width:0}
.hide{display:none!important}

/* ---------- 3) COMPONENTS ---------- */
/* nav row + icon button */
.navrow{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-bottom:var(--s2)}
.ibtn{width:36px;height:36px;border-radius:50%;background:var(--fill2);border:0;display:grid;place-items:center;color:var(--accent);flex:none}
.eyebrow{font-size:13px;color:var(--label2);font-weight:500}

/* section */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 var(--s2) var(--s2)}
.sec-h h3{font-size:19px;font-weight:700}
.link{background:none;border:0;color:var(--accent);font-size:15px;font-weight:500}

/* group + cell (grouped-list rows) */
.group{background:var(--surface);border-radius:var(--r-l);overflow:hidden}
.cell{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:54px;padding:var(--s3) var(--s4);background:none;border:0;text-align:start;position:relative}
button.cell:active{background:var(--fill)}
.cell+.cell::before{content:"";position:absolute;top:0;inset-inline:var(--s4) 0;height:.5px;background:var(--sep)}
.cell .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--accent-tint);color:var(--accent)}
.cell .ico.tint,.ico.tint{background:color-mix(in srgb,var(--cc) 16%,transparent);color:var(--cc)}
.cell .body{flex:1;min-width:0;display:flex;flex-direction:column}
.cell .ttl{font-weight:600;overflow-wrap:anywhere}
.cell .sub{font-size:14px;color:var(--label2)}
.cell .end{display:flex;align-items:center;gap:6px;color:var(--label2);font-size:14px;flex:none}

/* card */
.card{background:var(--surface);border-radius:var(--r-l);padding:var(--s4)}
.tile{background:var(--surface);border-radius:var(--r-l);padding:var(--s3) var(--s4)}
.tile b{display:block;font-size:26px;font-weight:700;line-height:1.3}
.tile span{font-size:13px;color:var(--label2)}
button.tile{width:100%;border:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.grid3 .tile{padding:var(--s3)}
.grid3 .tile b{font-size:22px}

/* hero (Today's Focus) */
.hero{position:relative;overflow:hidden;background:var(--hero);color:#fff;border-radius:var(--r-xl);padding:var(--s5) var(--s5) var(--s5)}
.hero::after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;border:34px solid rgba(255,255,255,.07);inset-inline-end:-70px;top:-80px;pointer-events:none}
.hero .eyebrow{color:rgba(255,255,255,.72);display:flex;align-items:center;gap:6px}
.hero h2{font-size:26px;font-weight:700;line-height:1.35;margin:var(--s2) 0 var(--s1)}
.hero p{color:rgba(255,255,255,.8);font-size:15px;margin-bottom:var(--s4)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);height:50px;padding:0 var(--s5);border:0;border-radius:var(--r-m);font-size:17px;font-weight:600;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97);opacity:.85}
.btn.block{width:100%}
.btn.sm{height:36px;padding:0 var(--s4);font-size:15px;border-radius:18px}
.btn.primary{background:var(--accent-solid);color:var(--on-accent)}
.btn.tint{background:var(--accent-tint);color:var(--accent)}
.btn.gray{background:var(--fill2);color:var(--label)}
.btn.danger{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.btn.good{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.btn.onhero{background:#fff;color:var(--hero)}
.btn.plain{background:none;color:var(--accent)}
.btns{display:flex;gap:var(--s2)}
.btns>.btn{flex:1;padding:0 var(--s2)}

/* chip, badge, segmented */
.chips{display:flex;gap:var(--s2);flex-wrap:wrap}
.chips.scrollx{flex-wrap:nowrap;overflow-x:auto;margin-inline:calc(var(--s4) * -1);padding-inline:var(--s4);scrollbar-width:none}
.chips.scrollx::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 var(--s4);border-radius:18px;background:var(--fill2);border:0;font-size:15px;font-weight:500;white-space:nowrap;flex:none}
.chip.on{background:var(--accent-solid);color:var(--on-accent)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:9px;background:var(--fill2);color:var(--label2);white-space:nowrap}
.badge.red{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.badge.orange{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.badge.green{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.badge.accent{background:var(--accent-tint);color:var(--accent)}
.badge.tint{background:color-mix(in srgb,var(--cc) 16%,transparent);color:var(--cc)}
.seg{display:flex;background:var(--fill2);border-radius:var(--r-s);padding:2px}
.seg button{flex:1;height:32px;border:0;background:none;border-radius:8px;font-size:14px;font-weight:600;color:var(--label)}
.seg button.on{background:var(--seg-on);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* progress: bar, ring, dots */
.bar{height:6px;border-radius:3px;background:var(--fill2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--cc,var(--accent));transition:width .5s}
.bar.thick{height:10px;border-radius:5px}
.ring{position:relative;flex:none}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--fill2)}
.dots i.on{background:var(--cc,var(--accent))}

/* forms */
.frow{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);position:relative;min-height:52px}
.frow+.frow::before{content:"";position:absolute;top:0;inset-inline:var(--s4) 0;height:.5px;background:var(--sep)}
.frow label{font-size:16px;color:var(--label);flex:none}
.frow.col{flex-direction:column;align-items:stretch;gap:var(--s2)}
.in{flex:1;min-width:0;background:none;border:0;outline:0;font-size:17px;text-align:start}
textarea.in{min-height:64px;resize:none;line-height:1.5;width:100%}
.in::placeholder{color:var(--label3)}
select.in{appearance:none;-webkit-appearance:none;background:var(--fill2);border-radius:var(--r-s);padding:8px 12px;font-size:16px;flex:1}
.flabel{font-size:13px;color:var(--label2);margin:0 var(--s2) var(--s2)}
.switch{position:relative;width:51px;height:31px;flex:none;margin-inline-start:auto}
.switch input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:16px;background:var(--fill2);transition:background .2s}
.switch span::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(-20px)}
.swatches{display:flex;gap:var(--s3)}
.sw{width:34px;height:34px;border-radius:50%;border:0;background:var(--cc);position:relative}
.sw.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2.5px solid var(--cc)}

/* empty state */
.empty{text-align:center;padding:var(--s6) var(--s5);color:var(--label2)}
.empty .ei{width:64px;height:64px;border-radius:20px;background:var(--accent-tint);color:var(--accent);display:grid;place-items:center;margin:0 auto var(--s4)}
.empty h3{color:var(--label);font-size:19px;margin-bottom:var(--s1)}
.empty p{font-size:15px;margin-bottom:var(--s4)}

/* tab bar */
.tabbar{position:absolute;inset-inline:0;bottom:0;z-index:10;transform:translateZ(0);display:flex;padding:6px 4px calc(6px + var(--safe-b));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-top:.5px solid var(--sep)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--label2);font-size:11px;font-weight:600;padding:4px 0;position:relative}
.tab.on{color:var(--accent)}
.tab .nb{position:absolute;top:-1px;inset-inline-start:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:17px;font-weight:700}

/* layers: sheets (modal), pages (push), full (sessions) */
.layer{position:absolute;inset:0;z-index:20;pointer-events:none}
.layer.in{pointer-events:auto}
.layer.sheet .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.38);opacity:0;transition:opacity .28s}
.layer.sheet.in .backdrop{opacity:1}
.layer.sheet .panel{--surface:var(--surface-elev);position:absolute;inset-inline:0;bottom:0;max-height:92%;display:flex;flex-direction:column;background:var(--bg-sheet);border-radius:var(--r-xl) var(--r-xl) 0 0;transform:translateY(102%);transition:transform .34s cubic-bezier(.2,.85,.25,1);padding-bottom:var(--safe-b)}
.layer.sheet.in .panel{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--label3);margin:8px auto 0;flex:none}
.snav{display:flex;align-items:center;justify-content:space-between;padding:var(--s3) var(--s4) var(--s2);flex:none}
.snav b{font-size:17px}
.snav button{background:none;border:0;color:var(--accent);font-size:17px;min-width:56px}
.snav .save{font-weight:700;text-align:end}
.sbody{overflow-y:auto;overscroll-behavior-y:contain;padding:var(--s2) var(--s4) var(--s5)}
.layer.page,.layer.full{background:var(--bg);transition:transform .34s cubic-bezier(.2,.85,.25,1)}
.layer.page{transform:translateX(-100%)}
.layer.full{transform:translateY(100%)}
.layer.page.in,.layer.full.in{transform:none}

/* toast */
.toast{position:absolute;bottom:calc(84px + var(--safe-b));inset-inline:var(--s5);z-index:40;text-align:center;background:var(--label);color:var(--bg);padding:12px 16px;border-radius:var(--r-m);font-weight:600;font-size:15px;opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s}
.toast.on{opacity:1;transform:none}

/* ---------- screen-specific (built from the tokens above) ---------- */
/* flip card */
.flip{perspective:1400px;height:min(390px,54vh)}
.flipper{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.75,.2,1);transform-style:preserve-3d}
.flip.on .flipper{transform:rotateY(180deg)}
.flip.static .flipper{transition:none}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:var(--surface);border-radius:var(--r-xl);padding:var(--s5);display:flex;flex-direction:column;overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--accent-tint);background-color:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.face-top{display:flex;gap:var(--s2);flex-wrap:wrap}
.face-main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:700;line-height:1.5;padding:var(--s3) 0;overflow-wrap:anywhere}
.face-main.sm{font-size:19px;font-weight:600}
.face-hint{text-align:center;color:var(--label3);font-size:13px}
.sess .ctl-b{display:none}
.sess.flipped .ctl-b{display:block}
.sess.flipped .ctl-a{display:none}
.rate-note{font-size:12px;font-weight:500;opacity:.75;display:block}
.btns.rate .btn{flex-direction:column;height:64px;gap:0;font-size:16px}

/* focus timer */
.focusring{display:flex;justify-content:center;margin:var(--s5) 0}
.big-time{font-size:58px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;line-height:1.1}

/* notes-style mistake cards */
.note{background:var(--surface);border-radius:var(--r-l);padding:var(--s4);text-align:start;width:100%;border:0;display:block}
.note:active{background:var(--fill)}
.note .q{font-size:17px;font-weight:600;margin:var(--s2) 0;overflow-wrap:anywhere}
.note .ans{background:color-mix(in srgb,var(--green) 11%,transparent);border-radius:var(--r-s);padding:var(--s2) var(--s3);font-size:15px;margin-bottom:var(--s2);overflow-wrap:anywhere}
.note .meta{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}

/* week chart */
.week{display:flex;align-items:flex-end;gap:var(--s2);height:120px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:11px;color:var(--label2)}
.week i{width:100%;max-width:30px;border-radius:8px;background:var(--fill2);min-height:6px}
.week .today i{background:var(--accent-solid)}
.week .has i{background:color-mix(in srgb,var(--accent-solid) 45%,var(--fill2))}
.week .today.has i{background:var(--accent-solid)}
.mini-line{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3)}
.mini-line:last-child{margin-bottom:0}
.mini-line .l{width:64px;font-size:14px;flex:none}
.mini-line .r{width:46px;text-align:end;font-size:13px;color:var(--label2);flex:none}


/* ---------- schedule / photos / viewer (same tokens) ---------- */
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:var(--s4)}
.dpill{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 0 7px;border-radius:16px;border:0;background:var(--surface);color:var(--label);min-width:0}
.dpill small{font-size:11px;font-weight:600;color:var(--label2)}
.dpill b{font-size:18px;font-weight:700;line-height:1.35}
.dpill i{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:2px}
.dpill.today b{color:var(--accent)}
.dpill.sel{background:var(--accent-solid)}
.dpill.sel small,.dpill.sel b{color:#fff}
.dpill.sel i{background:rgba(255,255,255,.85)}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;margin:0 var(--s2) var(--s3)}
.dayhead b{font-size:19px}
.dayhead span{color:var(--label2)}
.hl{position:absolute;inset-inline:0;height:0;border-top:.5px solid var(--sep)}
.hl span{position:absolute;top:-9px;inset-inline-start:0;width:42px;font-size:11px;color:var(--label2);background:var(--surface);text-align:start}
.tlbody{position:absolute;top:0;bottom:0;inset-inline-start:48px;inset-inline-end:0}
.blk{position:absolute;display:flex;flex-direction:column;gap:1px;text-align:start;border:0;border-radius:12px;padding:7px 10px;background:color-mix(in srgb,var(--cc) 16%,var(--surface));border-inline-start:4px solid var(--cc);overflow:hidden;color:var(--label);min-width:0}
.blk b{font-size:14px;color:var(--cc);line-height:1.3}
.blk span{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk small{font-size:11px;color:var(--label2);margin-top:auto}
.now{position:absolute;inset-inline-start:42px;inset-inline-end:0;height:2px;background:var(--red);z-index:3;border-radius:1px}
.now::before{content:"";position:absolute;inset-inline-start:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.thumb{aspect-ratio:1;border:0;padding:0;border-radius:var(--r-m);overflow:hidden;background:var(--fill2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.viewer{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;color:#fff}
.vnav{padding:calc(var(--safe-t) + 8px) var(--s4) 0;margin:0}
.vwrap{flex:1;overflow:auto;display:flex;padding:var(--s3)}
.vwrap img{margin:auto;max-width:100%;max-height:100%;object-fit:contain}
.vwrap.z img{max-width:none;max-height:none;width:230%}

.thpv{width:34px;height:34px;border-radius:9px;object-fit:cover;display:block}

.flip{position:relative}

.swh.l{left:14px;color:var(--red);border-color:var(--red);transform:rotate(-8deg)}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

<body>
<div id="app">
  <div id="root"></div>
  <nav class="tabbar" id="tabbar" aria-label="التنقل الرئيسي"></nav>
  <div id="layers"></div>
  <div class="toast" id="toast" role="status"></div>
  <input type="file" accept="image/*" multiple id="imgIn" data-chg="imgSet" hidden>
  <input type="file" accept="image/*" id="themeIn" data-chg="themeSet" hidden>
</div>

<script>
/* ============================ STORAGE ============================ */
const KEY='ahmed-study-os-v1';
const DEF={subjects:[],lessons:[],questions:[],sessions:[],exams:[],days:[],plan:{blocks:[]},settings:{theme:'auto',name:'أحمد'}};
let S=structuredClone(DEF);
const LS=()=>window['local'+'Storage'];
async function load(){
  try{
    let v=null;
    if(window.storage){const r=await window.storage.get(KEY);v=r&&r.value}
    else v=LS().getItem(KEY);
    if(v)S=Object.assign(structuredClone(DEF),JSON.parse(v));
  }catch(e){}
  S.settings=Object.assign({theme:'auto',name:'أحمد',cap:5},S.settings||{});
  if(!S.settings.ver||S.settings.ver<2){(S.lessons||[]).forEach(l=>{if(l.studied)l.stage=l.stage>=4?2:l.stage>=2?1:0});S.settings.ver=2}
  S.plan=S.plan||{blocks:[]};S.plan.blocks=S.plan.blocks||[];
}
let saveT=null;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    const v=JSON.stringify(S);
    try{ if(window.storage)await window.storage.set(KEY,v); else LS().setItem(KEY,v); }catch(e){}
  },150);
}

/* ============================ HELPERS ============================ */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY=()=>ymd(new Date());
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const pc=n=>Math.round(n*100);
const daysTxt=n=>n===1?'يوم':n===2?'يومين':n<=10?`${n} أيام`:`${n} يوم`;
const whenTxt=d=>{const n=diff(d,TODAY());return n<0?'متأخر '+daysTxt(-n):n===0?'النهارده':n===1?'بكرة':n===2?'بعد يومين':'بعد '+daysTxt(n)};
const intTxt=n=>({1:'بكرة',2:'بعد يومين',3:'بعد 3 أيام',7:'بعد أسبوع',14:'بعد أسبوعين',30:'بعد شهر',60:'بعد شهرين'})[n]||('بعد '+daysTxt(n));
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2200)}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)();[0,.28,.56].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.22);o.start(a.currentTime+t);o.stop(a.currentTime+t+.22)})}catch(e){}}
const hap=(p=10)=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function touch(){const t=TODAY();if(!S.days.includes(t))S.days.push(t)}

/* ============================ ICONS ============================ */
const ICON={
 home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/>',
 book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M8.5 7.5h7"/>',
 repeat:'<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>',
 note:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>',
 chart:'<path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 back:'<path d="M9 5l7 7-7 7"/>',
 chev:'<path d="M15 5l-7 7 7 7"/>',
 x:'<path d="M6 6l12 12M18 6 6 18"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
 play:'<path d="M7 4.5v15l13-7.5z" fill="currentColor"/>',
 pause:'<path d="M8 5v14M16 5v14" stroke-width="3.2"/>',
 flame:'<path d="M12 22c4 0 7-2.7 7-6.5 0-3-2-5-3.5-6.5C15 11 13.5 12 13 12c0-3-1-6-4-9-.5 4-5 6-5 12.5C4 19.3 8 22 12 22z"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 exam:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 14l2 2 4-4"/>',
 target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".9" fill="currentColor"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
 alert:'<path d="M12 3.5 22 20H2z"/><path d="M12 10v4.5M12 17.5v.01"/>',
 sparkle:'<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
 cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/>',
 bell:'<path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4"/>',
 photo:'<rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10.5" r="1.6"/><path d="M4 17l5-4.5 4 3 3-2.5 4 3.5"/>'
};
const ic=(n,s=22,w=1.8)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]||''}</svg>`;

/* ============================ DESIGN-SYSTEM COMPONENTS (JS) ============================ */
const at=o=>Object.entries(o||{}).map(([k,v])=>` data-${k}="${esc(v)}"`).join('');
const ui={
  btn:(label,o={})=>`<button class="btn ${o.kind||'primary'}${o.block?' block':''}${o.sm?' sm':''}" data-act="${o.act||''}"${at(o.data)}>${o.icon?ic(o.icon,20):''}${label}</button>`,
  chip:(label,o={})=>`<button class="chip${o.on?' on':''}" data-act="${o.act||'pick'}"${at(o.data)}>${label}</button>`,
  badge:(t,k='')=>`<span class="badge ${k}">${t}</span>`,
  cell:o=>{
    const tag=o.act?'button':'div';
    const end=(o.end||'')+((o.act&&o.chev!==false)?ic('chev',16):'');
    return `<${tag} class="cell ${o.cc||''}"${o.act?` data-act="${o.act}"`:''}${at(o.data)}>`+
      (o.icon?`<span class="ico${o.cc?' tint':''}">${ic(o.icon,20)}</span>`:'')+
      `<span class="body"><span class="ttl">${o.title}</span>${o.sub?`<span class="sub">${o.sub}</span>`:''}</span>`+
      (end?`<span class="end">${end}</span>`:'')+`</${tag}>`;
  },
  group:c=>`<div class="group">${c.join('')}</div>`,
  bar:(p,cc,thick)=>`<div class="bar${thick?' thick':''} ${cc||''}"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`,
  ring:(p,o={})=>{const s=o.size||120,st=o.stroke||12,r=(s-st)/2,c=2*Math.PI*r,h=s/2;
    return `<div class="ring" style="width:${s}px;height:${s}px"><svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--fill2)" stroke-width="${st}"/><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${o.color||'var(--accent-solid)'}" stroke-width="${st}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.min(1,p/100))}" transform="rotate(-90 ${h} ${h})"/></svg><div class="ring-c">${o.center||''}</div></div>`},
  dots:(n,cc,t=3)=>`<div class="dots ${cc||''}">${[...Array(t).keys()].map(i=>`<i class="${i<n?'on':''}"></i>`).join('')}</div>`,
  empty:(icon,title,text,btn)=>`<div class="empty"><div class="ei">${ic(icon,30)}</div><h3>${title}</h3><p>${text}</p>${btn||''}</div>`,
  seg:(items,cur,act)=>`<div class="seg">${items.map(([v,l])=>`<button class="${v===cur?'on':''}" data-act="${act}" data-v="${v}">${l}</button>`).join('')}</div>`
};
ui.sec=(t,html,action)=>`<section><div class="sec-h"><h3>${t}</h3>${action||''}</div>${html}</section>`;

/* ============================ DOMAIN ============================ */
const INT=[2,7,30]; /* مراجعة بعد يومين ثم أسبوع ثم شهر، وبعدها الدرس يخلص */
const TYPES=['حفظ','فهم','حساب','تطبيق'];
const REASONS=['سهو','مفهوم مش واضح','نسيت القانون','استعجال','خطأ في الحساب','فهمت السؤال غلط'];
const COLORS=[0,1,2,3,4,5];
const subj=i=>S.subjects.find(s=>s.id===i);
const lesson=i=>S.lessons.find(l=>l.id===i);
const quest=i=>S.questions.find(q=>q.id===i);
const isDue=l=>l.studied&&!l.done&&l.next&&l.next<=TODAY();
const isLate=l=>l.studied&&!l.done&&l.next&&l.next<TODAY();
const dueAll=()=>S.lessons.filter(isDue).sort((a,b)=>a.next.localeCompare(b.next));
function dueLessons(){const cap=S.settings.cap||5,doneToday=S.lessons.filter(l=>l.revOn===TODAY()).length;return dueAll().slice(0,Math.max(0,cap-doneToday))}
const lateLessons=()=>S.lessons.filter(isLate);
const cls=sid=>'c'+((subj(sid)||{}).c||0);

function schedule(l,r){
  const t=TODAY();l.lastReview=t;l.revOn=t;l.reviews=(l.reviews||0)+1;
  if(r==='forgot'){l.stage=0;l.done=false;l.next=addD(t,1);return}
  l.stage=Math.min(3,l.stage+1);
  if(l.stage>=3){l.done=true;l.next=''}else{l.done=false;l.next=addD(t,INT[l.stage])}
}
const previewTxt=(l,k)=>k==='forgot'?'بكرة':((l.done||l.stage+1>=3)?'خلصت المراجعات':intTxt(INT[l.stage+1]));
function markStudied(l){l.studied=true;l.done=false;l.studiedAt=TODAY();l.stage=0;l.next=addD(TODAY(),INT[0]);touch()}

function subStats(sid){
  const ls=S.lessons.filter(l=>l.sid===sid),st=ls.filter(l=>l.studied);
  return{total:ls.length,studied:st.length,pct:ls.length?st.length/ls.length:0,due:st.filter(isDue).length,late:st.filter(isLate).length};
}
function overall(){
  const total=S.lessons.length,st=S.lessons.filter(l=>l.studied);
  const mastery=st.length?st.reduce((a,l)=>a+(l.done?3:l.stage)/3,0)/st.length:0;
  return{total,studied:st.length,pct:total?st.length/total:0,mastery};
}
function typeStats(){
  return TYPES.map(t=>{
    let r=0,w=0;S.questions.forEach(q=>{if(q.type===t){r+=q.right||0;w+=q.wrong||0}});
    const n=r+w;return{t,right:r,wrong:w,n,rate:n?w/n:0,smooth:(w+.5)/(n+2)};
  });
}
const weakType=()=>typeStats().filter(x=>x.n>=3&&x.rate>=.3).sort((a,b)=>b.rate-a.rate)[0]||null;
function priority(q,ts){
  const t=ts.find(x=>x.t===q.type);
  let p=1+(q.wrong||0)*1.5+(t?t.smooth:.25)*4-Math.min(q.streak||0,3)*.6;
  if(q.lastWrong&&diff(TODAY(),q.lastWrong)<=7)p+=1;
  return Math.max(.3,p);
}
function pickQ(pool,n){
  const ts=typeStats(),items=pool.map(q=>({q,w:priority(q,ts)})),out=[];
  while(out.length<n&&items.length){
    const tot=items.reduce((a,x)=>a+x.w,0);let r=Math.random()*tot,i=0;
    for(;i<items.length;i++){r-=items[i].w;if(r<=0)break}
    if(i>=items.length)i=items.length-1;
    out.push(items.splice(i,1)[0].q);
  }
  return out;
}
function qPool(sid){
  const ok=S.questions.filter(q=>{const l=lesson(q.lid);return l&&l.studied&&(!sid||q.sid===sid)});
  return ok.length||sid?ok:S.questions.slice();
}
function recordAnswer(q,ok,reason){
  if(ok){q.right=(q.right||0)+1;q.streak=(q.streak||0)+1}
  else{q.wrong=(q.wrong||0)+1;q.streak=0;q.lastWrong=TODAY();(q.reasons=q.reasons||[]).push({d:TODAY(),r:reason||null})}
  q.last=TODAY();touch();save();
}
function setLastReason(q,r){const a=q.reasons||[];if(a.length)a[a.length-1].r=r;save()}
const lastReason=q=>{const a=(q.reasons||[]).filter(x=>x.r);return a.length?a[a.length-1].r:null};
function streak(){
  const set=new Set(S.days);let n=0,d=TODAY();
  if(!set.has(d))d=addD(d,-1);
  while(set.has(d)){n++;d=addD(d,-1)}
  return n;
}
const minsOn=d=>S.sessions.filter(x=>x.d===d).reduce((a,x)=>a+x.m,0);
function nextToStudy(){
  const un=S.lessons.filter(l=>!l.studied);if(!un.length)return null;
  const exam=sid=>{const s=subj(sid);return s&&s.exam?diff(s.exam,TODAY()):9999};
  return un.sort((a,b)=>exam(a.sid)-exam(b.sid))[0];
}
function focusPick(){
  const due=dueLessons();
  if(due.length){
    const late=due.filter(isLate).length,rest=dueAll().length-due.length,more=rest>0?` وفاضل ${rest} هيجوا في الأيام الجاية.`:'';
    return{ic:'repeat',label:'مراجعة النهارده',title:`راجع ${due.length} ${due.length===1?'درس':'دروس'}`,
      sub:(late?`${late} منهم متأخر. ابدأ بيهم دلوقتي قبل ما تنساهم.`:'مواعيدهم النهارده. خمس دقايق لكل درس كفاية.')+more,cta:'ابدأ المراجعة',act:'startReview'};
  }
  const w=weakType();
  if(w&&qPool().some(q=>q.type===w.t))
    return{ic:'target',label:'تدريب ذكي',title:`تدريب على أسئلة ${w.t}`,sub:`بتغلط في ${pc(w.rate)}% منها، فرفعنا أولويتها في التدريب.`,cta:'ابدأ التدريب',act:'startPractice'};
  const nx=nextToStudy();
  if(nx)return{ic:'book',label:'درس جديد',title:`ذاكر: ${esc(nx.title)}`,sub:`${esc((subj(nx.sid)||{}).name||'')}. شغّل جلسة تركيز وابدأ.`,cta:'ابدأ جلسة تركيز',act:'startFocus',data:{lid:nx.id}};
  if(S.questions.length)return{ic:'exam',label:'كله تمام',title:'مفيش مراجعات النهارده',sub:'جرّب امتحان شخصي يقيس مستواك في اللي ذاكرته.',cta:'ابدأ امتحان',act:'startExam'};
  return null;
}

/* ============================ LAYERS ============================ */
const L=[];
function paint(l){
  const sc=l.el.querySelector('.scroll,.sbody');const top=sc?sc.scrollTop:0;
  const html=l.render();
  l.el.innerHTML=l.kind==='sheet'?`<div class="backdrop" data-act="close"></div><div class="panel"><div class="grab"></div>${html}</div>`:html;
  const sc2=l.el.querySelector('.scroll,.sbody');if(sc2&&top)sc2.scrollTop=top;
  if(typeof hydrate==='function')hydrate(l.el);
}
function openLayer(kind,render,live,onClose){
  const el=document.createElement('div');el.className='layer '+kind;$('layers').appendChild(el);
  const l={el,kind,render,live,onClose};L.push(l);paint(l);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('in')));
  return l;
}
function closeAll(){while(L.length){const l=L.pop();l.el.classList.remove('in');if(l.onClose)l.onClose();const e=l.el;setTimeout(()=>e.remove(),380)}}
function closeLayer(){
  const l=L.pop();if(!l)return;
  l.el.classList.remove('in');if(l.onClose)l.onClose();
  setTimeout(()=>l.el.remove(),380);
  renderAll();
}
const topLayer=()=>L[L.length-1];
function renderAll(){
  renderRoot();
  L.forEach(l=>{if(l.live)paint(l)});
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&L.length)closeLayer()});

/* ============================ ROOT / TABS ============================ */
let tab='today',mFilter='all';
const TABS=[['today','اليوم','home'],['schedule','الجدول','cal'],['subjects','المواد','book'],['review','مراجعة','repeat'],['mistakes','الأخطاء','note']];
function renderRoot(){
  const scr={today:todayScreen,schedule:scheduleScreen,subjects:subjectsScreen,review:reviewScreen,mistakes:mistakesScreen}[tab]||todayScreen;
  const old=$('root').querySelector('.scroll');const top=old&&old.dataset.tab===tab?old.scrollTop:0;
  $('root').innerHTML=`<div class="scroll" data-tab="${tab}">${scr()}</div>`;
  if(top)$('root').querySelector('.scroll').scrollTop=top;
  const due=dueLessons().length;
  $('tabbar').innerHTML=TABS.map(([k,l,i])=>`<button class="tab${k===tab?' on':''}" data-act="tab" data-tab="${k}" ${k===tab?'aria-current="page"':''}>${ic(i,25,k===tab?2.1:1.7)}<span>${l}</span>${k==='review'&&due?`<span class="nb">${due}</span>`:''}</button>`).join('');
}
const title=(t,right)=>`<div class="navrow"><span></span>${right||''}</div><h1 class="t-large" style="margin:0 var(--s2) var(--s4)">${t}</h1>`;

/* ---------- Today ---------- */
function greeting(){const h=new Date().getHours();return(h<12?'صباح الخير':h<18?'يومك سعيد':'مساء الخير')+' يا '+esc(S.settings.name||'أحمد')}
function todayScreen(){
  const dateTxt=new Date().toLocaleDateString('ar-EG-u-nu-latn',{weekday:'long',day:'numeric',month:'long'});
  const head=`<div class="navrow"><span class="eyebrow">أحمد Study OS · ${dateTxt}</span><span class="row" style="gap:8px"><button class="ibtn" data-act="openProgress" aria-label="التقدم">${ic('chart',20)}</button><button class="ibtn" data-act="settings" aria-label="الإعدادات">${ic('gear',20)}</button></span></div>
    <h1 class="t-large" style="margin:0 var(--s2) var(--s4)">${greeting()}</h1>`;
  if(!S.subjects.length){
    return head+`<div class="card" style="padding:var(--s2)">${ui.empty('sparkle','ابدأ من هنا','ضيف موادك ودروسك، والبرنامج هيحسب لك مواعيد المراجعة ويتعلم من أخطائك.',
      `<div class="stack" style="margin-top:0">${ui.btn('ضيف أول مادة',{act:'addSubject',block:1,icon:'plus'})}${ui.btn('جرّب ببيانات تجريبية',{act:'demo',kind:'tint',block:1})}</div>`)}</div>`;
  }
  const f=focusPick(),due=dueLessons(),o=overall(),tm=minsOn(TODAY());
  let out=head+'<div class="stack">';
  out+=f?`<div class="hero"><div class="eyebrow">${ic(f.ic,16,2)} Today's Focus · ${f.label}</div><h2>${f.title}</h2><p>${f.sub}</p>${ui.btn(f.cta,{act:f.act,data:f.data,kind:'onhero'})}</div>`
    :`<div class="hero"><div class="eyebrow">${ic('sparkle',16,2)} Today's Focus</div><h2>ضيف دروس وأسئلة</h2><p>كل ما تضيف محتوى أكتر، الخطة بتبقى أذكى.</p>${ui.btn('ضيف درس',{act:'addLesson',kind:'onhero'})}</div>`;
  out+=`<div class="grid3">
    <div class="tile"><b>${tm}</b><span>دقيقة النهارده</span></div>
    <div class="tile"><b>${streak()}</b><span>يوم متتالي</span></div>

let form={};
const val=id=>{const e=$(id);return e?e.value.trim():''};

const lessonOptions=sel=>S.lessons.map(l=>`<option value="${l.id}" ${l.id===sel?'selected':''}>${esc((subj(l.sid)||{}).name||'')} — ${esc(l.title)}</option>`).join('');
const subjOptions=sel=>S.subjects.map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.name)}</option>`).join('');
const pickChips=(g,items,cur)=>`<div class="chips" data-group="${g}">${items.map(i=>ui.chip(esc(i),{on:i===cur,data:{g,v:i}})).join('')}</div>`;

const A={};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||!t.dataset.act)return;const f=A[t.dataset.act];if(f){e.preventDefault();f(t,e)}});
document.addEventListener('change',e=>{const t=e.target.closest('[data-chg]');if(t&&A[t.dataset.chg])A[t.dataset.chg](t,e)});

A.tab=el=>{closeAll();tab=el.dataset.tab;renderAll();const s=$('root').querySelector('.scroll');if(s)s.scrollTop=0};
A.close=()=>closeLayer();
A.mfilter=el=>{mFilter=el.dataset.v;renderAll()};
A.repMist=()=>{closeAll();mFilter='rep';tab='mistakes';renderAll()};
A.pick=el=>{const g=el.dataset.g,v=el.dataset.v;form[g]=v;el.parentElement.querySelectorAll('.chip,.sw').forEach(c=>c.classList.toggle('on',c===el))};

/* subject sheet */
A.addSubject=()=>subjectSheet();
A.editSubject=el=>subjectSheet(el.dataset.id);
function subjectSheet(id){
  const s=id?subj(id):null;form={c:s?s.c:S.subjects.length%6,id};
  openLayer('sheet',()=>sheetNav(s?'تعديل المادة':'مادة جديدة','saveSubject')+`<div class="sbody">
    <div class="group"><div class="frow"><label>الاسم</label><input class="in" id="f-name" placeholder="مثلاً: فيزياء" value="${esc(s?s.name:'')}" maxlength="40"></div>
      <div class="frow"><label>ميعاد الامتحان</label><input class="in" id="f-exam" type="date" value="${s?s.exam||'':''}" style="text-align:end"></div></div>

    <div class="group"><div class="frow"><div class="swatches" data-group="c">${COLORS.map(c=>`<button class="sw c${c}${form.c===c?' on':''}" data-act="pickColor" data-v="${c}" aria-label="لون ${c+1}"></button>`).join('')}</div></div></div>
    ${s?`<div style="margin-top:var(--s5)">${ui.btn('احذف المادة',{act:'delSubject',data:{id},kind:'danger',block:1,icon:'trash'})}</div>`:''}</div>`);
  setTimeout(()=>{const e=$('f-name');if(e&&!s)e.focus()},380);
}
A.pickColor=el=>{form.c=+el.dataset.v;el.parentElement.querySelectorAll('.sw').forEach(c=>c.classList.toggle('on',c===el))};
A.saveSubject=()=>{
  const name=val('f-name');if(!name)return toast('اكتب اسم المادة');
  if(form.id){const s=subj(form.id);s.name=name;s.c=form.c;s.exam=val('f-exam')}
  else S.subjects.push({id:uid(),name,c:form.c,exam:val('f-exam')});
  save();closeLayer();
};
A.delSubject=el=>{
  if(!confirm('تحذف المادة وكل دروسها وأسئلتها؟'))return;

function startTimer(phase,secs){
  clearInterval(F.tick);F.phase=phase;F.total=F.left=secs;F.endAt=Date.now()+secs*1000;F.run=true;
  paint(topLayer());ftick();F.tick=setInterval(ftick,500);
}
A.fstart=()=>startTimer('run',F.mins*60);
A.fbreak=()=>startTimer('break',F.brk*60);
function ftick(){
  if(!F||(F.phase!=='run'&&F.phase!=='break'))return;
  if(F.run)F.left=Math.max(0,Math.round((F.endAt-Date.now())/1000));
  const c=$('fClock');if(c)c.textContent=`${pad(Math.floor(F.left/60))}:${pad(F.left%60)}`;
  const circ=document.querySelectorAll('.layer.full .ring circle')[1];
  if(circ){const r=+circ.getAttribute('r'),cc=2*Math.PI*r;circ.setAttribute('stroke-dashoffset',cc*(1-(F.total-F.left)/F.total))}
  document.title=(F.run?`${pad(Math.floor(F.left/60))}:${pad(F.left%60)} · `:'')+'أحمد Study OS';
  if(F.run&&F.left<=0){
    beep();
    if(F.phase==='run')ffinish(true);
    else{clearInterval(F.tick);F.run=false;F.phase='breakdone';document.title='أحمد Study OS';paint(topLayer())}
  }
}
A.fpause=()=>{
  if(F.run){F.run=false;F.left=Math.max(0,Math.round((F.endAt-Date.now())/1000))}
  else{F.run=true;F.endAt=Date.now()+F.left*1000}
  paint(topLayer());ftick();
};
function elapsedMin(){
  const left=F.run?Math.max(0,Math.round((F.endAt-Date.now())/1000)):F.left;
  return Math.floor((F.total-left)/60);
}
function logSession(m){if(m>=1){S.sessions.push({id:uid(),d:TODAY(),m,sid:F.sid,lid:F.lid||''});touch();save();F.count++}}
function ffinish(auto){
  clearInterval(F.tick);document.title='أحمد Study OS';
  const m=auto===true?F.mins:elapsedMin();
  logSession(m);hap(18);
  F.logged=m>=1?m:0;F.run=false;F.phase='done';paint(topLayer());
}
A.ffinish=()=>ffinish();
A.fskip=()=>{clearInterval(F.tick);F.run=false;F.phase='breakdone';document.title='أحمد Study OS';paint(topLayer())};
A.fagain=()=>{clearInterval(F.tick);F.run=false;F.phase='setup';paint(topLayer())};
A.fmark=()=>{const l=lesson(F.lid);if(l&&!l.studied){markStudied(l);F.marked=true;save();toast('اتحسب ميعاد مراجعة الدرس');paint(topLayer())}};

};

const norm=s=>String(s).replace(/\s+/g,' ').trim().toLowerCase();
const stripMarks=s=>s.replace(/[\u200e\u200f\u202a-\u202e]/g,'');
function cleanLine(s){
  s=stripMarks(s).trim();
  s=s.replace(/[.\u2026·_\-–—]{3,}\s*[\d٠-٩]+\s*$/,'');
  s=s.replace(/\s{2,}[\d٠-٩]+\s*$/,'');
  s=s.replace(/^[\u2022\u25CF\u25AA\-\*–—]\s*/,'');
  s=s.replace(/^([\d٠-٩]+|[A-Za-z])\s*[.\-)\:،–]\s*/,'');
  return s.trim();
}
function parseLessons(text,sid){
  const have=new Set(S.lessons.filter(l=>l.sid===sid).map(l=>norm(l.title)));
  const list=[];let dups=0;
  text.split(/\r?\n/).forEach(raw=>{
    const t=cleanLine(raw);if(t.length<2)return;
    const k=norm(t);if(have.has(k)){dups++;return}
    have.add(k);list.push(t.slice(0,80));
  });
  return{list:list.slice(0,300),dups};
}

function guessType(q){
  if(/احسب|أوجد|اوجد|اشتق|كم |حل /.test(q))return'حساب';
  if(/ليه|لماذا|فسّر|فسر|علل|قارن|ازاي|كيف/.test(q))return'فهم';
  if(/طبّق|طبق|مثال|لو /.test(q))return'تطبيق';
  return'حفظ';
}
function parseQuestions(text,sid,lid){
  const out=[],fresh=[];let cur=lid||'',skipped=0,dups=0;
  const find=t=>S.lessons.find(l=>l.sid===sid&&norm(l.title)===norm(t))||fresh.find(l=>norm(l.title)===norm(t));
  const seen=new Set();
  text.split(/\r?\n/).forEach(raw=>{
    const line=stripMarks(raw).trim();if(!line)return;
    if(line[0]==='#'){
      const t=line.replace(/^#+\s*/,'').trim();if(!t)return;
      let l=find(t);if(!l){l=newLesson(sid,t.slice(0,80));fresh.push(l)}
      cur=l.id;return;
    }
    if(!line.includes('|')){skipped++;return}
    const p=line.split('|').map(x=>x.trim());
    const q=p[0].replace(/^([\d٠-٩]+)\s*[.\-)]\s*/,''),a=p[1];
    if(!q||!a||!cur){skipped++;return}
    const key=cur+'~'+norm(q);
    if(seen.has(key)||S.questions.some(x=>x.lid===cur&&norm(x.q)===norm(q))){dups++;return}
    seen.add(key);
    out.push({lid:cur,q,a,type:TYPES.includes(p[2])?p[2]:guessType(q)});
  });
  const used=new Set(out.map(x=>x.lid));
  return{out,fresh:fresh.filter(l=>used.has(l.id)),skipped,dups};
}

/* ============================ CURRICULUM PHOTOS (IndexedDB) ============================ */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{
    if(this.db)return res(this.db);if(!window.indexedDB)return rej(new Error('no idb'));
    const r=indexedDB.open('study-os-img',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('img');
    r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error);
  })},
  async tx(mode,fn){
    const db=await this.open();
    return new Promise((res,rej)=>{const t=db.transaction('img',mode);const rq=fn(t.objectStore('img'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error)});
  },
  put(k,b){return this.tx('readwrite',s=>s.put(b,k))},
  get(k){return this.tx('readonly',s=>s.get(k))},
  del(k){return this.tx('readwrite',s=>s.delete(k))}
};
const imgURL={};
async function hydrate(root){
  for(const im of [...root.querySelectorAll('img[data-img]')]){
    const k=im.dataset.img;
    try{if(!imgURL[k]){const b=await IDB.get(k);if(!b)continue;imgURL[k]=URL.createObjectURL(b)}im.src=imgURL[k]}catch(e){}
  }
}
function compressImage(file,max=1600,q=.78){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q);
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};im.src=url;
  });
}

const DAYS=[[6,'السبت','سبت'],[0,'الأحد','أحد'],[1,'الاثنين','اثنين'],[2,'الثلاثاء','ثلاثاء'],[3,'الأربعاء','أربعاء'],[4,'الخميس','خميس'],[5,'الجمعة','جمعة']];
const dayIdx=dow=>DAYS.findIndex(d=>d[0]===dow);
const dayName=dow=>(DAYS[dayIdx(dow)]||[0,''])[1];
function weekStart(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+1)%7));return ymd(d)}
const dateOfDow=dow=>addD(weekStart(),dayIdx(dow));
const tmin=t=>{const p=String(t||'0:0').split(':').map(Number);return (p[0]||0)*60+(p[1]||0)};
const tstr=m=>`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
function t12(m){const h=Math.floor(m/60)%24,mm=m%60;return `${h%12||12}:${pad(mm)} ${h>=12?'م':'ص'}`}
const durTxt=m=>{const h=Math.floor(m/60),r=m%60;if(!h)return `${m} دقيقة`;const ht=h===1?'ساعة':h===2?'ساعتين':`${h} ساعات`;return r?`${ht} و${r} د`:ht};
let selDow=new Date().getDay();
const blocksOf=dow=>S.plan.blocks.filter(b=>b.dow===dow).sort((a,b)=>tmin(a.start)-tmin(b.start));

function timeline(bs,isToday){
  const H=68;
  const items=bs.map(b=>({b,s:tmin(b.start),e:tmin(b.start)+b.dur,col:0,n:1}));
  let cl=[],end=0;
  const flush=()=>{const n=Math.max(...cl.map(x=>x.col))+1;cl.forEach(x=>x.n=n);cl=[]};
  items.forEach(it=>{
    if(cl.length&&it.s>=end){flush();end=0}
    const used=cl.filter(x=>x.e>it.s).map(x=>x.col);let c=0;while(used.includes(c))c++;
    it.col=c;cl.push(it);end=Math.max(end,it.e);
  });
  if(cl.length)flush();
  const t0=Math.max(0,Math.floor((Math.min(...items.map(x=>x.s))-30)/60)*60);
  const t1=Math.min(1440,Math.ceil((Math.max(...items.map(x=>x.e))+30)/60)*60);
  const hours=[];for(let m=t0;m<=t1;m+=60)hours.push(m);
  const now=new Date(),nm=now.getHours()*60+now.getMinutes();
  return `<div class="card" style="padding:16px 12px"><div style="position:relative;height:${(t1-t0)/60*H}px">
    ${hours.map(m=>`<div class="hl" style="top:${(m-t0)/60*H}px"><span>${t12(m).replace(':00','')}</span></div>`).join('')}
    <div class="tlbody">${items.map(it=>{const sb=subj(it.b.sid)||{name:'—',c:0};
      return `<button class="blk c${sb.c}" data-act="openBlock" data-id="${it.b.id}" style="top:${(it.s-t0)/60*H}px;height:${Math.max(46,(it.e-it.s)/60*H-3)}px;inset-inline-start:${it.col/it.n*100}%;width:calc(${100/it.n}% - 4px)"><b>${esc(sb.name)}</b><span>${esc(it.b.note||'مذاكرة')}</span><small>${t12(it.s)} – ${t12(it.e)}</small></button>`}).join('')}</div>
    ${isToday&&nm>=t0&&nm<=t1?`<div class="now" style="top:${(nm-t0)/60*H}px"></div>`:''}</div></div>`;
}

  const add=`<span class="row" style="gap:8px"><button class="ibtn" data-act="exportIcs" aria-label="الجدول في التقويم">${ic('bell',20)}</button><button class="ibtn" data-act="addBlock" aria-label="حصة جديدة">${ic('plus',20,2.2)}</button></span>`;

  const today=new Date().getDay();
  out+=`<div class="daystrip">${DAYS.map(([k,n,sh])=>`<button class="dpill${k===selDow?' sel':''}${k===today?' today':''}" data-act="selDay" data-v="${k}" aria-label="${n}"><small>${sh}</small><b>${pd(dateOfDow(k)).getDate()}</b><i style="${blocksOf(k).length?'':'opacity:0'}"></i></button>`).join('')}</div>`;
  const bs=blocksOf(selDow),date=dateOfDow(selDow),total=bs.reduce((a,b)=>a+b.dur,0);
  out+='<div class="tlswipe">';
  out+=`<div class="dayhead"><div><b>${dayName(selDow)}</b><span> · ${fmtDate(date)}${selDow===today?' (النهارده)':''}</span></div><span class="t-sub">${bs.length?`${bs.length} ${bs.length===1?'حصة':'حصص'} · ${durTxt(total)}`:''}</span></div>`;
  out+=bs.length?timeline(bs,date===TODAY()):`<div class="card">${ui.empty('cal','اليوم فاضي','مفيش حصص مذاكرة في اليوم ده.',ui.btn('ضيف حصة',{act:'addBlock',icon:'plus'}))}</div>`;
  out+='</div>';

  return out;
}

/* ============================ THEME FROM IMAGE ============================ */
function rgb2hsl(r,g,b){
  r/=255;g/=255;b/=255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}
  return[h,s,l];
}
function pickAccent(img){
  const c=document.createElement('canvas');c.width=c.height=48;
  const x=c.getContext('2d');x.drawImage(img,0,0,48,48);
  const d=x.getImageData(0,0,48,48).data,bins=new Array(36).fill(0),sats=new Array(36).fill(0);let tot=0;
  for(let i=0;i<d.length;i+=4){
    const[h,s,l]=rgb2hsl(d[i],d[i+1],d[i+2]);
    const w=s*Math.max(0,1-Math.abs(l-.5)*1.7);if(w<.02)continue;
    const b=Math.floor(h/10)%36;bins[b]+=w;sats[b]+=s*w;tot+=w;
  }
  if(tot<8)return{h:220,s:.2};
  let best=0,bv=-1;
  for(let i=0;i<36;i++){const v=bins[(i+35)%36]+bins[i]*2+bins[(i+1)%36];if(v>bv){bv=v;best=i}}
  const s=sats[best]/Math.max(bins[best],1e-6);
  return{h:best*10+5,s:Math.min(.8,Math.max(.45,s))};
}
function applyAccent(){
  let st=document.getElementById('themeStyle');const a=S.settings.acc;
  if(!a){if(st)st.remove();return}
  if(!st){st=document.createElement('style');st.id='themeStyle';document.head.appendChild(st)}
  const H=a.h,P=Math.round(a.s*100),hs=(s,l,al)=>`hsl(${H} ${s}% ${l}%${al!=null?` / ${al}`:''})`;
  st.textContent=`:root{--accent:${hs(P,40)};--accent-solid:${hs(P,42)};--accent-tint:${hs(P,45,.13)};--hero:${hs(Math.round(P*.9),34)};--sc0:${hs(P,42)}}
:root[data-theme="dark"]{--accent:${hs(P,72)};--accent-solid:${hs(P,52)};--accent-tint:${hs(P,65,.2)};--hero:${hs(Math.round(P*.8),27)};--sc0:${hs(P,72)}}`;
}
async function applyThemeImage(){
  const root=document.documentElement,k=S.settings.themeImg;
  if(!k){root.classList.remove('has-himg');root.style.removeProperty('--hero-img');return}
  try{
    if(!imgURL[k]){const b=await IDB.get(k);if(!b){root.classList.remove('has-himg');return}imgURL[k]=URL.createObjectURL(b)}
    root.style.setProperty('--hero-img',`url("${imgURL[k]}")`);root.classList.add('has-himg');
  }catch(e){}
}

A.themeSet=async el=>{
  const f=el.files[0];if(!f)return;
  toast('بجهّز الثيم…');
  try{
    const blob=await compressImage(f,900,.8);
    const acc=await new Promise((res,rej)=>{
      const u=URL.createObjectURL(blob),im=new Image();
      im.onload=()=>{try{res(pickAccent(im))}catch(e){rej(e)}URL.revokeObjectURL(u)};
      im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u;
    });
    const old=S.settings.themeImg,k='th'+uid();

    S.settings.themeImg=k;S.settings.acc=acc;save();
    applyAccent();await applyThemeImage();renderAll();toast('الثيم اتغير على حسب صورتك');

};

};

/* ============================ SCHEDULE → PHONE CALENDAR (.ics) ============================ */
const BYDAY=['SU','MO','TU','WE','TH','FR','SA'];
const icsEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
function icsFold(line){
  const enc=new TextEncoder();let out='',cur='',bytes=0;
  for(const ch of line){const n=enc.encode(ch).length;if(bytes+n>72){out+=cur+'\r\n ';cur='';bytes=1}cur+=ch;bytes+=n}
  return out+cur;
}
const icsDT=(date,min)=>date.replace(/-/g,'')+'T'+pad(Math.floor(min/60))+pad(min%60)+'00';
function buildIcs(alarm){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ahmed Study OS//AR//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+icsEsc('جدول المذاكرة')];
  const now=new Date(),stamp=now.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''),td=now.getDay();
  S.plan.blocks.forEach(b=>{
    const sb=subj(b.sid)||{name:'مذاكرة'},k=(b.dow-td+7)%7,date=addD(TODAY(),k),s=tmin(b.start),e=s+b.dur;
    L.push('BEGIN:VEVENT','UID:'+b.id+'@study-os','DTSTAMP:'+stamp,'DTSTART:'+icsDT(date,s),'DTEND:'+icsDT(date,e),
      'RRULE:FREQ=WEEKLY;BYDAY='+BYDAY[b.dow],'SUMMARY:'+icsEsc('مذاكرة '+sb.name),'DESCRIPTION:'+icsEsc(b.note||''));
    if(alarm>0)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('حصة '+sb.name),'TRIGGER:-PT'+alarm+'M','END:VALARM');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n')+'\r\n';
}
A.exportIcs=()=>{

  form={alarm:10};

    <p class="flabel">نبّهني قبل الحصة بـ</p><div class="chips">${[[0,'من غير تنبيه'],[10,'10 دقايق'],[30,'نص ساعة'],[60,'ساعة']].map(([v,t])=>ui.chip(t,{on:v===form.alarm,act:'pickAlarm',data:{v}})).join('')}</div>
    <div style="margin-top:var(--s5)">${ui.btn('نزّل ملف التقويم',{act:'dlIcs',block:1,icon:'cal'})}</div>
    <p class="flabel" style="margin-top:var(--s4)">بعد التنزيل افتح الملف من إشعار التنزيل واختار تطبيق التقويم. لو نزّلته قبل كده، امسح الحصص القديمة من التقويم الأول عشان ماتتكررش.</p></div>`);

/* ============================ GESTURES + BACK BUTTON ============================ */
let exitArmed=false;
const pushSentinel=()=>{try{history.pushState({so:1},'')}catch(e){}};
function armHistory(){try{history.replaceState({so:0},'');history.pushState({so:1},'')}catch(e){}}
window.addEventListener('popstate',()=>{
  const l=L[L.length-1];
  if(l){if(l.back)l.back();else closeLayer();pushSentinel();return}
  if(tab!=='today'){tab='today';renderAll();pushSentinel();return}
  if(!exitArmed){exitArmed=true;toast('اضغط رجوع تاني للخروج');setTimeout(()=>{exitArmed=false},2200);pushSentinel();return}
  history.back();
});
(function(){
  let g=null;
  const top=()=>L[L.length-1]||null;
  const blocked=t=>t.closest('.chips.scrollx,.vwrap.z,select')||(t.closest('textarea')&&t.closest('textarea').scrollTop>0);
  document.addEventListener('touchstart',e=>{
    g=null;if(e.touches.length!==1)return;
    const t=e.touches[0],l=top(),tg=e.target;
    if(!tg||!tg.closest||blocked(tg))return;
    const app=$('app').getBoundingClientRect();let cand=null;
    if(l&&l.kind==='sheet'){
      if(tg.closest('.panel')){const b=tg.closest('.sbody');if(tg.closest('.grab,.snav')||!b||b.scrollTop<=0)cand='sheet'}
    }else if(l&&l.el.querySelector('.viewer')){cand='viewer'}
    else if(l&&l.kind==='page'){if(t.clientX>=app.right-44)cand='page'}
    else if(l&&l.kind==='full'){if(tg.closest('.sess.flipped .flip')&&l.el.querySelector('.ctl-b'))cand='card'}
    else if(!l&&tab==='schedule'&&tg.closest('.tlswipe'))cand='day';
    if(cand)g={cand,x:t.clientX,y:t.clientY,dx:0,dy:0,mode:null,layer:l,t0:Date.now()};
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!g)return;
    const t=e.touches[0];g.dx=t.clientX-g.x;g.dy=t.clientY-g.y;
    const ax=Math.abs(g.dx),ay=Math.abs(g.dy);
    if(!g.mode){
      if(ax<8&&ay<8)return;
      const c=g.cand;
      if(c==='sheet'||c==='viewer'){if(g.dy>8&&ay>ax*1.2)g.mode='v';else{g=null;return}}
      else if(c==='page'){if(g.dx<-8&&ax>ay*1.2)g.mode='h';else{g=null;return}}
      else{if(ax>10&&ax>ay*1.3)g.mode='h';else{g=null;return}}
    }
    if(e.cancelable)e.preventDefault();
    const l=g.layer;
    if(g.cand==='sheet'){
      const p=l.el.querySelector('.panel'),bd=l.el.querySelector('.backdrop');
      p.style.transition='none';p.style.transform=`translateY(${Math.max(0,g.dy)}px)`;
      if(bd){bd.style.transition='none';bd.style.opacity=String(Math.max(0,1-g.dy/420))}
    }else if(g.cand==='viewer'){l.el.style.transition='none';l.el.style.transform=`translateY(${Math.max(0,g.dy)}px)`}
    else if(g.cand==='page'){l.el.style.transition='none';l.el.style.transform=`translateX(${Math.min(0,g.dx)}px)`}
    else if(g.cand==='card'){
      const f=l.el.querySelector('.flip');f.style.transition='none';f.style.transform=`translateX(${g.dx}px) rotate(${g.dx/18}deg)`;
      const hl=f.querySelector('.swh.l'),hr=f.querySelector('.swh.r');
      if(hl)hl.style.opacity=String(Math.min(1,Math.max(0,-g.dx/90)));
      if(hr)hr.style.opacity=String(Math.min(1,Math.max(0,g.dx/90)));
    }
  },{passive:false});
  const settle=(el,fn)=>{el.style.transition='transform .28s cubic-bezier(.2,.85,.25,1)';fn();setTimeout(()=>{el.style.transition=''},320)};
  function finish(cancel){
    if(!g)return;const s=g;g=null;if(!s.mode)return;
    const l=s.layer;if((top()||null)!==(l||null))return;
    const dt=Math.max(1,Date.now()-s.t0),vy=s.dy/dt,vx=s.dx/dt;
    if(s.cand==='sheet'){
      const p=l.el.querySelector('.panel'),bd=l.el.querySelector('.backdrop');
      if(!cancel&&(s.dy>110||(s.dy>45&&vy>.6))){
        settle(p,()=>{p.style.transform='translateY(105%)'});if(bd){bd.style.transition='opacity .25s';bd.style.opacity='0'}
        hap(6);setTimeout(()=>{if(top()===l)closeLayer()},220);
      }else{settle(p,()=>{p.style.transform=''});if(bd){bd.style.transition='opacity .25s';bd.style.opacity=''}}
    }else if(s.cand==='viewer'){
      if(!cancel&&(s.dy>120||(s.dy>50&&vy>.6))){settle(l.el,()=>{l.el.style.transform='translateY(105%)'});setTimeout(()=>{if(top()===l)closeLayer()},220)}
      else settle(l.el,()=>{l.el.style.transform=''});
    }else if(s.cand==='page'){
      if(!cancel&&(s.dx<-90||(s.dx<-50&&vx<-.5))){settle(l.el,()=>{l.el.style.transform='translateX(-105%)'});hap(6);setTimeout(()=>{if(top()===l)closeLayer()},220)}
      else settle(l.el,()=>{l.el.style.transform=''});
    }else if(s.cand==='day'){
      if(cancel||Math.abs(s.dx)<70)return;
      const i=dayIdx(selDow),n=Math.min(6,Math.max(0,i+(s.dx<0?1:-1)));
      if(n!==i){selDow=DAYS[n][0];hap(6);renderAll()}
    }else if(s.cand==='card'){
      const f=l.el.querySelector('.flip');if(!f)return;
      if(!cancel&&(Math.abs(s.dx)>110||(Math.abs(vx)>.6&&Math.abs(s.dx)>40))){
        const ok=s.dx>0;hap(10);
        f.style.transition='transform .22s ease-in';f.style.transform=`translateX(${ok?'140%':'-140%'}) rotate(${ok?18:-18}deg)`;
        setTimeout(()=>{
          const b=l.el.querySelector(`[data-act=rate][data-r=${ok?'ok':'forgot'}]`)||l.el.querySelector(`[data-act=xgrade][data-ok="${ok?1:0}"]`);
          if(b&&top()===l)b.click();
        },190);
      }else{
        settle(f,()=>{f.style.transform=''});
        f.querySelectorAll('.swh').forEach(h=>{h.style.opacity=''});
      }
    }
  }
  document.addEventListener('touchend',()=>finish(false));
  document.addEventListener('touchcancel',()=>finish(true));
})();
